name: snake

on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar snake combinada (GitHub + Bitbucket)
        env:
          GH_USER: Borges1607
          GH_TOKEN: ${{ secrets.SNAKE_GH_TOKEN }}
          BB_WORKSPACE: ${{ secrets.BB_WORKSPACE }}
          BB_USER: ${{ secrets.BB_USER }}
          BB_APP_PASSWORD: ${{ secrets.BB_APP_PASSWORD }}
          BB_EMAILS: ${{ secrets.BB_EMAILS }}
          OUT_DIR: dist
        run: node scripts/generate-snake.mjs

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
